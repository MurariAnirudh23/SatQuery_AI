<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="agriSoil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a5320"/>
      <stop offset="50%" stop-color="#386641"/>
      <stop offset="100%" stop-color="#6b705c"/>
    </linearGradient>
    <pattern id="cropRows" width="20" height="20" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="20" y2="20" stroke="#a7c957" stroke-width="2" opacity="0.6"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#agriSoil)"/>
  <!-- Field boundaries -->
  <rect x="30" y="30" width="220" height="160" fill="#588157" stroke="#344e41" stroke-width="3"/>
  <circle cx="140" cy="110" r="65" fill="#38b000" opacity="0.85"/>
  <rect x="280" y="30" width="260" height="160" fill="#6a994e" stroke="#344e41" stroke-width="3"/>
  <rect x="280" y="30" width="260" height="160" fill="url(#cropRows)"/>
  <rect x="570" y="30" width="200" height="260" fill="#2d6a4f" stroke="#344e41" stroke-width="3"/>
  <circle cx="670" cy="160" r="80" fill="#70e000" opacity="0.75"/>
  
  <rect x="30" y="220" width="220" height="220" fill="#a7c957" opacity="0.9" stroke="#344e41" stroke-width="3"/>
  <rect x="280" y="220" width="260" height="220" fill="#386641" stroke="#344e41" stroke-width="3"/>
  <circle cx="410" cy="330" r="95" fill="#007200" opacity="0.8"/>
  
  <rect x="30" y="465" width="360" height="105" fill="#2d6a4f" stroke="#344e41" stroke-width="3"/>
  <rect x="420" y="320" width="350" height="250" fill="#1b4332" stroke="#344e41" stroke-width="3"/>
  <circle cx="595" cy="445" r="105" fill="#38b000" opacity="0.7"/>

  <!-- Irrigation canals -->
  <path d="M 0 205 Q 260 215 550 205 T 800 215" fill="none" stroke="#0077b6" stroke-width="7"/>
  <path d="M 265 0 Q 275 300 265 600" fill="none" stroke="#0077b6" stroke-width="6"/>
  <path d="M 555 0 L 555 600" fill="none" stroke="#0077b6" stroke-width="5"/>
  
  <rect x="20" y="20" width="260" height="40" rx="8" fill="#0f172a" fill-opacity="0.85"/>
  <text x="35" y="45" fill="#10b981" font-family="monospace" font-size="14" font-weight="bold">SENTINEL-2 L2A | NDVI 0.82</text>
  <text x="35" y="75" fill="#e2e8f0" font-family="monospace" font-size="11">Punjab Precision Agri Watch</text>
</svg>
