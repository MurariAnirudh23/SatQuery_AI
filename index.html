        // Map Widget Component for Interactive Leaflet GIS Map
        function MapWidget() {
            const mapContainerRef = useRef(null);
            const mapInstanceRef = useRef(null);

            useEffect(() => {
                if (!mapContainerRef.current || mapInstanceRef.current) return;
                if (window.L) {
                    const map = window.L.map(mapContainerRef.current).setView([20.5937, 78.9629], 5);
                    window.L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        attribution: '&copy; OpenStreetMap contributors'
                    }).addTo(map);

                    window.L.marker([17.3850, 78.4867]).addTo(map).bindPopup("<b>Hyderabad AOI</b><br>Urban Watch Zone").openPopup();
                    window.L.marker([-3.4653, -62.2159]).addTo(map).bindPopup("<b>Amazon Rainforest AOI</b><br>Deforestation Watch");

                    mapInstanceRef.current = map;
                }
                return () => {
                    if (mapInstanceRef.current) {
                        mapInstanceRef.current.remove();
                        mapInstanceRef.current = null;
                    }
                };
            }, []);

            return <div ref={mapContainerRef} className="w-full h-full min-h-[460px] rounded-2xl" />;
        }

                                                        <span className="text-xs font-bold text-slate-900">{evalResult.rating_label}</span>
                                                        <span className="text-2xl font-extrabold text-brand-700">{evalResult.score_percentage}%</span>
                                                    </div>
                                                    <div className="w-full bg-slate-100 h-3 rounded-full overflow-hidden">
                                                        <div className="bg-brand-600 h-full rounded-full transition-all" style={{ width: `${evalResult.score_percentage}%` }}></div>
                                                    </div>
                                                    <div className="space-y-1.5">
                                                        {evalResult.feedback_points && evalResult.feedback_points.map((fp, i) => (
                                                            <div key={i} className="flex items-start space-x-2 text-[11px] text-slate-700">
                                                                <span className="text-brand-600 mt-0.5">✓</span>
                                                                <span>{fp}</span>
                                                            </div>
                                                        ))}
                                                    </div>
                                                    {evalResult.improved_suggestion && (
                                                        <div className="bg-brand-50 border border-brand-200 rounded-xl p-3 text-[11px] text-brand-800">
                                                            <span className="font-bold">Improved:</span> {evalResult.improved_suggestion}
                                                        </div>
                                                    )}
                                                </div>
                                            ) : (
                                                <div className="text-center text-sm text-slate-400 py-8">
                                                    <i data-lucide="terminal" className="w-8 h-8 mx-auto mb-2 opacity-50"></i>
                                                    <p>Write a prompt and click evaluate to see results.</p>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* 15. INTERACTIVE QUIZ */}
                            {currentView === 'quiz' && (
                                <div className="space-y-6 animate-fade-in">
                                    <div className="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm">
                                        <h2 className="text-lg font-bold text-slate-900">{t('quiz_title')}</h2>
                                        <p className="text-xs text-slate-500 mt-0.5">Test your knowledge of remote sensing, satellite imagery, and GIS concepts.</p>
                                    </div>
                                    <div className="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm space-y-6">
                                        {/* Question 1 */}
                                        <div className="space-y-2">
                                            <div className="text-xs font-bold text-slate-900">Q1: What does NDVI measure?</div>
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-2">
                                                {[
                                                    { id: 'A', text: 'Water depth in oceans' },
                                                    { id: 'B', text: 'Vegetation health and density' },
                                                    { id: 'C', text: 'Urban building height' },
                                                    { id: 'D', text: 'Atmospheric temperature' }
                                                ].map(opt => (
                                                    <button key={opt.id} onClick={() => setQuizAnswers({...quizAnswers, q1: opt.id})}
                                                        className={`text-left px-3 py-2 rounded-xl border text-xs transition ${quizAnswers.q1 === opt.id ? 'border-brand-500 bg-brand-50 text-brand-800 font-bold' : 'border-slate-200 text-slate-700 hover:bg-slate-50'}`}
                                                    >
                                                        <span className="font-mono font-bold mr-2">{opt.id}.</span>{opt.text}
                                                    </button>
                                                ))}
                                            </div>
                                            {quizSubmitted && (
                                                <div className={`text-[11px] font-mono font-bold ${quizAnswers.q1 === 'B' ? 'text-brand-700' : 'text-red-600'}`}>
                                                    {quizAnswers.q1 === 'B' ? '✓ Correct!' : '✗ Incorrect. Answer: B — Vegetation health and density'}
                                                </div>
                                            )}
                                        </div>

                                        {/* Question 2 */}
                                        <div className="space-y-2">
                                            <div className="text-xs font-bold text-slate-900">Q2: Which sensor type can penetrate cloud cover?</div>
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-2">
                                                {[
                                                    { id: 'A', text: 'SAR (Synthetic Aperture Radar)' },
                                                    { id: 'B', text: 'Optical RGB Camera' },
                                                    { id: 'C', text: 'Thermal Infrared' },
                                                    { id: 'D', text: 'Panchromatic Sensor' }
                                                ].map(opt => (
                                                    <button key={opt.id} onClick={() => setQuizAnswers({...quizAnswers, q2: opt.id})}
                                                        className={`text-left px-3 py-2 rounded-xl border text-xs transition ${quizAnswers.q2 === opt.id ? 'border-brand-500 bg-brand-50 text-brand-800 font-bold' : 'border-slate-200 text-slate-700 hover:bg-slate-50'}`}
                                                    >
                                                        <span className="font-mono font-bold mr-2">{opt.id}.</span>{opt.text}
                                                    </button>
                                                ))}
                                            </div>
                                            {quizSubmitted && (
                                                <div className={`text-[11px] font-mono font-bold ${quizAnswers.q2 === 'A' ? 'text-brand-700' : 'text-red-600'}`}>
                                                    {quizAnswers.q2 === 'A' ? '✓ Correct!' : '✗ Incorrect. Answer: A — SAR (Synthetic Aperture Radar)'}
                                                </div>
                                            )}
                                        </div>

                                        <div className="flex items-center space-x-3">
                                            <button onClick={handleQuizSubmit} className="bg-slate-900 hover:bg-slate-800 text-white text-xs font-semibold px-5 py-2.5 rounded-xl shadow-sm transition">
                                                Submit Quiz
                                            </button>
                                            {quizSubmitted && (
                                                <span className="text-sm font-bold text-brand-700">Score: {quizScore} / 2</span>
                                            )}
                                            {quizSubmitted && (
                                                <button onClick={() => { setQuizSubmitted(false); setQuizAnswers({}); setQuizScore(0); }} className="text-xs text-slate-500 hover:text-slate-700 underline transition">
                                                    Retry
                                                </button>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* 16. REPORTS */}
                            {currentView === 'reports' && (
                                <div className="space-y-6 animate-fade-in">

                                        <p className="text-xs text-slate-500 mt-0.5">Generate a printable audit report summarizing your analysis session, inputs, queries, AI responses, and evidence.</p>
                                    </div>
                                    <div className="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm space-y-4">
                                        <h3 className="text-xs font-mono font-bold text-slate-700 uppercase">Report Preview</h3>
                                        <div className="bg-slate-50 border border-slate-200 rounded-xl p-5 space-y-3">
                                            <div className="flex items-center justify-between border-b border-slate-200 pb-3">
                                                <div>
                                                    <div className="text-sm font-extrabold text-slate-900">SatQuery AI — Analysis Report</div>
                                                    <div className="text-[10px] font-mono text-slate-500">Generated: {new Date().toLocaleDateString()} | Session ID: SQ-{Math.random().toString(36).substring(2, 8).toUpperCase()}</div>
                                                </div>
                                                <img src="/samples/satquery_logo.png" className="w-8 h-8 rounded-lg object-contain" alt="Logo"/>
                                            </div>
                                            <div className="space-y-2 text-xs text-slate-700">
                                                <div><span className="font-mono font-bold text-slate-500">Image Analyzed:</span> {singleImgName}</div>
                                                <div><span className="font-mono font-bold text-slate-500">Total Queries:</span> {chatMessages.filter(m => m.sender === 'user').length}</div>
                                                <div><span className="font-mono font-bold text-slate-500">AI Responses:</span> {chatMessages.filter(m => m.sender === 'bot').length}</div>
                                                <div><span className="font-mono font-bold text-slate-500">Model Used:</span> BigEarthNet-19 Specialist Adapter</div>
                                            </div>
                                            <div className="border-t border-slate-200 pt-3 space-y-2">
                                                <div className="text-[10px] font-mono font-bold text-slate-500 uppercase">Conversation Log</div>

                                                    <div key={i} className="text-[11px] text-slate-600">
                                                        <span className="font-mono font-bold text-slate-500">[{msg.timestamp}] {msg.sender === 'user' ? 'USER' : 'AI'}:</span> {msg.text.substring(0, 120)}{msg.text.length > 120 ? '...' : ''}
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                        <button onClick={() => window.print()} className="bg-slate-900 hover:bg-slate-800 text-white text-xs font-semibold px-5 py-2.5 rounded-xl shadow-sm transition flex items-center space-x-2">
                                            <i data-lucide="printer" className="w-3.5 h-3.5"></i>
                                            <span>Print Report</span>
                                        </button>
                                    </div>
                                </div>
                            )}

                                            <img src="/samples/satquery_logo.png" className="w-12 h-12 rounded-xl object-contain" alt="SatQuery AI"/>
                                            <div>
                                                <h2 className="text-xl font-extrabold text-slate-900">{t('about_title')}</h2>
                                                <p className="text-xs text-slate-500">Ask. Analyze. Understand.</p>
                                            </div>
                                        </div>
                                        <p className="text-sm text-slate-700 leading-relaxed">
                                            SatQuery AI is an agentic, query-driven remote-sensing assistant that empowers non-experts to analyze satellite imagery, compare multi-temporal observations, understand land cover, detect changes, analyze optical/multispectral/SAR imagery, monitor areas of interest, and learn remote sensing concepts — all through natural-language interaction.
                                        </p>
                                    </div>

                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        <div className="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm space-y-3">

                                            <p className="text-xs text-slate-600 leading-relaxed">
                                                Satellite imagery analysis has traditionally required deep expertise in GIS, remote sensing, and programming. This creates a barrier for researchers, journalists, disaster-response teams, farmers, and policymakers who need actionable Earth observation insights but lack technical skills.
                                            </p>
                                        </div>
                                        <div className="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm space-y-3">
                                            <h3 className="text-xs font-mono font-bold text-brand-700 uppercase">Our Solution</h3>
                                            <p className="text-xs text-slate-600 leading-relaxed">
                                                SatQuery AI bridges this gap with an intelligent agentic controller that understands natural-language queries, selects the appropriate specialist model (land cover, change detection, object detection, VQA, spectral indices), and returns evidence-backed answers with visual proof.
                                            </p>
                                        </div>
                                    </div>

                                    <div className="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm space-y-3">
                                        <h3 className="text-xs font-mono font-bold text-slate-700 uppercase">Technology Stack</h3>
                                        <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
                                            {[
                                                { label: 'Frontend', items: 'React, Vite, Tailwind CSS, Leaflet' },
                                                { label: 'Backend', items: 'Python FastAPI, Node.js' },
                                                { label: 'AI/ML', items: 'BigEarthNet-19, Modular Specialist Models' },
                                                { label: 'Data', items: 'SQLite, PostGIS-ready Architecture' }
                                            ].map((stack, i) => (
                                                <div key={i} className="bg-slate-50 border border-slate-200 rounded-xl p-3">
                                                    <div className="text-[10px] font-mono font-bold text-brand-700 uppercase">{stack.label}</div>
                                                    <div className="text-[11px] text-slate-600 mt-1">{stack.items}</div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                                    <div className="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm space-y-3">
                                        <h3 className="text-xs font-mono font-bold text-slate-700 uppercase">Hackathon Context</h3>
                                        <p className="text-xs text-slate-600 leading-relaxed">
                                            Built for NASA Space Apps Challenge — demonstrating how AI-powered natural language interfaces can democratize access to Earth observation data and satellite imagery analysis for global communities.
                                        </p>
                                    </div>
                                </div>
                            )}

                            {/* 18. CONTACT US */}
                            {currentView === 'contact' && (
                                <div className="space-y-6 animate-fade-in">
                                    <div className="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm space-y-2">
                                        <h2 className="text-xl font-extrabold text-slate-900">{t('contact_title')}</h2>
                                        <p className="text-sm text-slate-600">Feel free to contact us — we'd love to hear from you!</p>
                                    </div>

                                    <div className="grid grid-cols-1 lg:grid-cols-5 gap-6">
                                        {/* Developer Info */}

                                            <h3 className="text-xs font-mono font-bold text-slate-700 uppercase">Developer Contact</h3>
                                            <div className="flex items-center space-x-4">
                                                <div className="w-14 h-14 rounded-2xl bg-brand-50 border border-brand-200 flex items-center justify-center">
                                                    <i data-lucide="user" className="w-7 h-7 text-brand-700"></i>
                                                </div>
                                                <div>
                                                    <div className="text-base font-extrabold text-slate-900">Suvanam Anirudh</div>
                                                    <div className="text-xs text-slate-500">Full-Stack Developer & AI Engineer</div>
                                                </div>
                                            </div>
                                            <div className="space-y-3">
                                                <div className="flex items-center space-x-3 bg-slate-50 border border-slate-200 rounded-xl px-4 py-3">
                                                    <i data-lucide="mail" className="w-4 h-4 text-brand-600"></i>
                                                    <div>
                                                        <div className="text-[10px] font-mono text-slate-500 uppercase">Email</div>
                                                        <a href="mailto:anirudhmail23@gmail.com" className="text-xs font-bold text-brand-700 hover:underline">anirudhmail23@gmail.com</a>
                                                    </div>
                                                </div>
                                                <div className="flex items-center space-x-3 bg-slate-50 border border-slate-200 rounded-xl px-4 py-3">
                                                    <i data-lucide="code" className="w-4 h-4 text-brand-600"></i>
                                                    <div>
                                                        <div className="text-[10px] font-mono text-slate-500 uppercase">Project</div>
                                                        <div className="text-xs font-bold text-slate-700">SatQuery AI — NASA Space Apps</div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>

                                        {/* Contact Form */}
                                        <div className="lg:col-span-3 bg-white border border-slate-200 rounded-2xl p-6 shadow-sm space-y-4">
                                            <h3 className="text-xs font-mono font-bold text-slate-700 uppercase">Send us a Message</h3>
                                            <form onSubmit={(e) => { e.preventDefault(); alert('Message sent! (Demo mode — contact anirudhmail23@gmail.com directly)'); }} className="space-y-3">
                                                <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                                    <div>
                                                        <label className="text-[11px] font-mono text-slate-600 font-semibold">Your Name</label>
                                                        <input type="text" className="w-full mt-1 bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs text-slate-900 focus:outline-none focus:border-brand-500" placeholder="Enter your name" required/>
                                                    </div>
                                                    <div>
                                                        <label className="text-[11px] font-mono text-slate-600 font-semibold">Your Email</label>
                                                        <input type="email" className="w-full mt-1 bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs text-slate-900 focus:outline-none focus:border-brand-500" placeholder="you@example.com" required/>
                                                    </div>
                                                </div>
                                                <div>
                                                    <label className="text-[11px] font-mono text-slate-600 font-semibold">Subject</label>
                                                    <input type="text" className="w-full mt-1 bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs text-slate-900 focus:outline-none focus:border-brand-500" placeholder="Subject of your message"/>
                                                </div>
                                                <div>
                                                    <label className="text-[11px] font-mono text-slate-600 font-semibold">Message</label>
                                                    <textarea rows={5} className="w-full mt-1 bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs text-slate-900 focus:outline-none focus:border-brand-500 resize-none" placeholder="Write your message here..." required></textarea>
                                                </div>
                                                <button type="submit" className="bg-slate-900 hover:bg-slate-800 text-white text-xs font-semibold px-5 py-2.5 rounded-xl shadow-sm transition flex items-center space-x-2">
                                                    <i data-lucide="send" className="w-3.5 h-3.5"></i>
                                                    <span>Send Message</span>
                                                </button>
                                            </form>
                                        </div>
                                    </div>
                                </div>
                            )}

                        </main>
                    </div>

                    {/* FOOTER */}
                    <footer className="bg-white border-t border-slate-200 py-6 text-slate-500 text-xs">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col md:flex-row items-center justify-between gap-4">
                            <div className="flex items-center space-x-2">
                                <span className="font-bold text-slate-900 font-sans">{t('app_title')}</span>
                                <span className="text-slate-400">— "{t('tagline')}"</span>
                            </div>
                            <div className="text-slate-500 text-[11px]">
                                NASA Space Apps Hackathon Prototype | Built with React, Tailwind CSS, Leaflet & FastAPI Architecture
                            </div>
                        </div>
                    </footer>
                </div>
            );
        }

        // Render React Application
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
