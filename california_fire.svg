<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="fireTerrain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2421"/>
      <stop offset="40%" stop-color="#2d3748"/>
      <stop offset="100%" stop-color="#1a202c"/>
    </linearGradient>
    <radialGradient id="hotspot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#f97316" stop-opacity="0.7"/>
      <stop offset="80%" stop-color="#eab308" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#eab308" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#fireTerrain)"/>
  
  <!-- Healthy Forest Areas -->
  <path d="M 0 0 L 350 0 L 280 220 L 120 280 L 0 350 Z" fill="#2d6a4f" opacity="0.8"/>
  <path d="M 500 450 L 800 380 L 800 600 L 420 600 Z" fill="#1b4332" opacity="0.85"/>
  
  <!-- Burn Scar Perimeter (SWIR NBR Index) -->
  <path d="M 180 250 Q 280 180 440 210 T 680 200 Q 740 320 650 420 T 360 480 Q 220 460 180 370 Z" fill="#451a03" stroke="#b45309" stroke-width="4" opacity="0.9"/>
  
  <!-- High Intensity Hotspots -->
  <circle cx="340" cy="280" r="70" fill="url(#hotspot)"/>
  <circle cx="520" cy="310" r="85" fill="url(#hotspot)"/>
  <circle cx="440" cy="390" r="60" fill="url(#hotspot)"/>
  <circle cx="580" cy="250" r="50" fill="url(#hotspot)"/>

  <!-- Smoke Plume -->
  <path d="M 380 270 Q 550 180 720 120 T 800 60 L 800 200 Q 640 260 460 320 Z" fill="#94a3b8" opacity="0.45"/>
  
  <!-- Overlay info box -->
  <rect x="20" y="20" width="300" height="42" rx="8" fill="#0f172a" fill-opacity="0.9"/>
  <text x="35" y="47" fill="#f97316" font-family="monospace" font-size="14" font-weight="bold">THERMAL SWIR | BURN SCAR 41.8 km²</text>
</svg>
