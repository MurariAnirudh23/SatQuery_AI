<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="ndviScale" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0000ff"/>    <!-- Water (-1.0 to 0.0) -->
      <stop offset="30%" stop-color="#d73027"/>   <!-- Bare soil / Urban (0.0 to 0.2) -->
      <stop offset="60%" stop-color="#fee08b"/>   <!-- Sparse Veg (0.2 to 0.5) -->
      <stop offset="100%" stop-color="#1a9850"/>  <!-- Dense Veg (0.5 to 1.0) -->
    </linearGradient>
  </defs>

  <!-- NDVI Heatmap Simulation -->
  <rect width="800" height="600" fill="#1a9850"/>
  <polygon points="100,100 350,80 380,300 80,320" fill="#91cf60"/>
  <polygon points="420,120 720,100 750,350 400,380" fill="#fee08b"/>
  <polygon points="200,350 600,380 580,550 150,520" fill="#d73027"/>

  <!-- Water Body -->
  <path d="M 0 250 Q 400 200 800 280 L 800 330 Q 400 250 0 300 Z" fill="#053061"/>

  <!-- Color Legend Scale Bar -->
  <g transform="translate(20, 520)">
    <rect width="300" height="40" fill="#0f172a" rx="4" opacity="0.9"/>
    <rect x="15" y="10" width="270" height="12" fill="url(#ndviScale)" rx="2"/>
    <text x="15" y="32" fill="#ffffff" font-family="monospace" font-size="9">-1.0 (Water)</text>
    <text x="130" y="32" fill="#ffffff" font-family="monospace" font-size="9">0.2 (Bare)</text>
    <text x="225" y="32" fill="#ffffff" font-family="monospace" font-size="9">+1.0 (Dense)</text>
  </g>

  <!-- Metadata Stamp -->
  <rect x="15" y="15" width="240" height="42" fill="#0f172a" opacity="0.9" rx="4"/>
  <text x="25" y="32" fill="#34d399" font-family="monospace" font-size="11" font-weight="bold">NDVI VEGETATION INDEX MAP</text>
  <text x="25" y="48" fill="#94a3b8" font-family="monospace" font-size="10">FORMULA: (NIR - RED) / (NIR + RED)</text>
</svg>
