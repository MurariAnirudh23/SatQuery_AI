<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <!-- Base Synthetic Aperture Radar (Grayscale Backscatter Intensity) -->
  <rect width="800" height="600" fill="#1e293b"/>
  
  <!-- Surface Roughness Texture -->
  <filter id="noise">
    <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" result="noise"/>
    <feColorMatrix type="matrix" values="0.3 0 0 0 0  0 0.3 0 0 0  0 0 0.3 0 0  0 0 0 0.6 0"/>
  </filter>
  <rect width="800" height="600" fill="#475569" filter="url(#noise)"/>

  <!-- Water Bodies (Dark specular reflectors in SAR VV/VH polarization) -->
  <path d="M 0 150 Q 200 80 350 250 T 600 380 T 800 300 L 800 360 T 600 440 T 350 310 Q 200 140 0 210 Z" fill="#020617"/>
  <polygon points="120,400 280,380 310,490 150,520" fill="#0f172a" opacity="0.9"/>

  <!-- Built-up Urban Double-Bounce High Backscatter (Bright White Pixels) -->
  <g fill="#ffffff">
    <rect x="530" y="100" width="18" height="14"/>
    <rect x="560" y="115" width="24" height="18"/>
    <rect x="600" y="95" width="16" height="20"/>
    <rect x="520" y="130" width="12" height="12"/>
    <rect x="580" y="145" width="20" height="14"/>
    <circle cx="650" cy="180" r="8"/>
    <circle cx="670" cy="160" r="10"/>
  </g>

  <!-- SAR Speckle & Polarization Annotations -->
  <g stroke="#ffffff" stroke-width="0.5" stroke-dasharray="3,6" opacity="0.3">
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="266" y1="0" x2="266" y2="600"/>
    <line x1="533" y1="0" x2="533" y2="600"/>
  </g>

  <!-- Scientific Metadata Stamp -->
  <rect x="15" y="15" width="250" height="42" fill="#0f172a" opacity="0.9" rx="4"/>
  <text x="25" y="32" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">SENTINEL-1 SAR (C-BAND VV+VH)</text>
  <text x="25" y="48" fill="#94a3b8" font-family="monospace" font-size="10">ORBIT: DESCENDING | CLOUD-PENETRATING</text>
</svg>
