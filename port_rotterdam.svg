<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="deepWater" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1d3a"/>
      <stop offset="60%" stop-color="#142c52"/>
      <stop offset="100%" stop-color="#09182f"/>
    </linearGradient>
  </defs>
  <!-- Ocean / Harbor Water -->
  <rect width="800" height="600" fill="url(#deepWater)"/>
  
  <!-- Coastline & Docks -->
  <path d="M 0 0 L 250 0 L 260 180 L 140 190 L 140 320 L 280 320 L 300 450 L 180 460 L 190 600 L 0 600 Z" fill="#475569" stroke="#334155" stroke-width="4"/>
  <path d="M 600 0 L 800 0 L 800 600 L 640 600 L 630 420 L 720 410 L 710 260 L 590 250 Z" fill="#64748b" stroke="#334155" stroke-width="4"/>
  
  <!-- Piers / Jetties -->
  <rect x="260" y="80" width="180" height="30" fill="#94a3b8" rx="4"/>
  <rect x="280" y="240" width="220" height="35" fill="#94a3b8" rx="4"/>
  <rect x="300" y="380" width="190" height="30" fill="#94a3b8" rx="4"/>
  <rect x="420" y="140" width="170" height="28" fill="#94a3b8" rx="4"/>
  
  <!-- Container Stacks -->
  <g fill="#f97316" opacity="0.8">
    <rect x="30" y="40" width="40" height="15"/>
    <rect x="80" y="40" width="40" height="15"/>
    <rect x="30" y="60" width="40" height="15" fill="#3b82f6"/>
    <rect x="80" y="60" width="40" height="15" fill="#eab308"/>
    <rect x="30" y="80" width="90" height="20" fill="#ef4444"/>
    <rect x="30" y="230" width="70" height="40" fill="#10b981"/>
    <rect x="30" y="280" width="80" height="25" fill="#6366f1"/>
  </g>
  
  <!-- Ships / Cargo Vessels with Detection Bounding Boxes -->
  <!-- Vessel 1 -->
  <rect x="460" y="70" width="110" height="40" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <rect x="450" y="60" width="130" height="60" fill="none" stroke="#22c55e" stroke-width="2" stroke-dasharray="4"/>
  <text x="455" y="55" fill="#22c55e" font-family="monospace" font-size="11" font-weight="bold">SHIP #1: CARGO [98%]</text>

  <!-- Vessel 2 -->
  <rect x="520" y="230" width="140" height="48" rx="20" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2"/>
  <rect x="510" y="220" width="160" height="68" fill="none" stroke="#22c55e" stroke-width="2" stroke-dasharray="4"/>
  <text x="515" y="215" fill="#22c55e" font-family="monospace" font-size="11" font-weight="bold">SHIP #2: TANKER [96%]</text>

  <!-- Vessel 3 -->
  <rect x="320" y="480" width="80" height="28" rx="10" fill="#e2e8f0"/>
  <rect x="312" y="472" width="96" height="44" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4"/>
  <text x="315" y="466" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="bold">TUG / SUPPORT [91%]</text>

  <!-- Header Overlay -->
  <rect x="20" y="20" width="280" height="40" rx="8" fill="#0f172a" fill-opacity="0.9"/>
  <text x="35" y="45" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="bold">OBJECT RETRIEVAL | 7 VESSELS</text>
</svg>
