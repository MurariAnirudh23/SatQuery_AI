<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <!-- Topographic Terrain Gradient Background -->
  <rect width="800" height="600" fill="#1e293b"/>
  
  <!-- Lineament Fracture & Drainage Networks -->
  <path d="M 50 50 Q 250 200 350 550" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="4,4"/>
  <path d="M 600 30 Q 400 300 150 450" fill="none" stroke="#0284c7" stroke-width="2.5"/>
  <path d="M 750 200 Q 550 400 300 580" fill="none" stroke="#38bdf8" stroke-width="2"/>

  <!-- High Infiltration Candidate Zones (Green/Cyan Polygons) -->
  <polygon points="280,180 420,160 450,280 300,310" fill="#06b6d4" opacity="0.45" stroke="#22d3ee" stroke-width="2"/>
  <polygon points="120,380 260,350 290,480 140,510" fill="#10b981" opacity="0.45" stroke="#34d399" stroke-width="2"/>

  <!-- Target Borewell Candidate Pins -->
  <g transform="translate(360, 230)">
    <circle cx="0" cy="0" r="14" fill="#0284c7" opacity="0.3"/>
    <circle cx="0" cy="0" r="8" fill="#38bdf8"/>
    <circle cx="0" cy="0" r="3" fill="#ffffff"/>
    <text x="16" y="4" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">TARGET A (17.3850° N, 78.4867° E)</text>
    <text x="16" y="18" fill="#94a3b8" font-family="monospace" font-size="9">HIGH RECHARGE POTENTIAL</text>
  </g>

  <g transform="translate(200, 430)">
    <circle cx="0" cy="0" r="14" fill="#059669" opacity="0.3"/>
    <circle cx="0" cy="0" r="8" fill="#10b981"/>
    <circle cx="0" cy="0" r="3" fill="#ffffff"/>
    <text x="16" y="4" fill="#34d399" font-family="monospace" font-size="11" font-weight="bold">TARGET B (17.3912° N, 78.4720° E)</text>
    <text x="16" y="18" fill="#94a3b8" font-family="monospace" font-size="9">MODERATE INFILTRATION ZONE</text>
  </g>

  <!-- Scientific Disclaimer Banner -->
  <rect x="20" y="540" width="760" height="44" fill="#0f172a" rx="4" stroke="#f59e0b" stroke-width="1"/>
  <text x="32" y="558" fill="#fbbf24" font-family="sans-serif" font-size="10" font-weight="bold">⚠️ SCIENTIFIC DISCLAIMER</text>
  <text x="32" y="573" fill="#cbd5e1" font-family="sans-serif" font-size="10">Indicative surface hydrogeological assessment only. Field verification required before drilling. Satellite imagery cannot measure underground depth.</text>

  <!-- Metadata Stamp -->
  <rect x="15" y="15" width="280" height="42" fill="#0f172a" opacity="0.9" rx="4"/>
  <text x="25" y="32" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">GROUNDWATER POTENTIAL MAP</text>
  <text x="25" y="48" fill="#94a3b8" font-family="monospace" font-size="10">NDWI + LINEAMENT + TERRAIN FUSION</text>
</svg>
