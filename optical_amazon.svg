<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="riverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b4965"/>
      <stop offset="50%" stop-color="#2b2d42"/>
      <stop offset="100%" stop-color="#0f2537"/>
    </linearGradient>
    <pattern id="forestPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="8" fill="#1b4332" opacity="0.8"/>
      <circle cx="25" cy="25" r="12" fill="#2d6a4f" opacity="0.9"/>
      <circle cx="35" cy="8" r="6" fill="#40916c" opacity="0.7"/>
    </pattern>
  </defs>

  <!-- Base Earth Surface (Optical RGB) -->
  <rect width="800" height="600" fill="#20402e"/>
  <rect width="800" height="600" fill="url(#forestPattern)"/>

  <!-- Meandering River -->
  <path d="M 0 150 Q 200 80 350 250 T 600 380 T 800 300 L 800 360 T 600 440 T 350 310 Q 200 140 0 210 Z" fill="url(#riverGrad)" stroke="#1d4ed8" stroke-width="1"/>

  <!-- Agricultural Clearing & Built-up Clusters -->
  <polygon points="120,400 280,380 310,490 150,520" fill="#745230" opacity="0.85"/>
  <polygon points="125,405 275,385 305,485 155,515" fill="#52b788" opacity="0.4"/>
  <polygon points="500,80 680,60 720,180 540,210" fill="#a0522d" opacity="0.8"/>
  <polygon points="510,90 670,70 705,170 545,195" fill="#d4a373" opacity="0.5"/>

  <!-- Built-up Structures / Buildings -->
  <rect x="530" y="100" width="18" height="14" fill="#cbd5e1" stroke="#475569" stroke-width="1"/>
  <rect x="560" y="115" width="24" height="18" fill="#94a3b8" stroke="#334155" stroke-width="1"/>
  <rect x="600" y="95" width="16" height="20" fill="#e2e8f0" stroke="#475569" stroke-width="1"/>

  <!-- Grid Coordinate Overlay -->
  <g stroke="#ffffff" stroke-width="0.5" stroke-dasharray="4,8" opacity="0.25">
    <line x1="200" y1="0" x2="200" y2="600"/>
    <line x1="400" y1="0" x2="400" y2="600"/>
    <line x1="600" y1="0" x2="600" y2="600"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="450" x2="800" y2="450"/>
  </g>

  <!-- Scientific Metadata Stamp -->
  <rect x="15" y="15" width="220" height="42" fill="#0f172a" opacity="0.85" rx="4"/>
  <text x="25" y="32" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">SENTINEL-2A OPTICAL RGB</text>
  <text x="25" y="48" fill="#94a3b8" font-family="monospace" font-size="10">RES: 10m | LAT: -3.4653° LON: -62.2159°</text>
</svg>
