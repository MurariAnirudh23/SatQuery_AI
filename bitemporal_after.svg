<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <!-- Background Vegetation / Forest (September 2026) -->
  <rect width="800" height="600" fill="#2d6a4f"/>
  
  <!-- Agricultural Fields -->
  <polygon points="100,100 350,80 380,300 80,320" fill="#d4a373"/>
  <polygon points="420,120 720,100 750,350 400,380" fill="#40916c"/>
  
  <!-- CONVERTED BUILT-UP / URBAN EXPANSION REGION (Significant 38% Change) -->
  <polygon points="200,350 600,380 580,550 150,520" fill="#64748b"/>

  <!-- New Built-up Industrial Complex Buildings -->
  <g fill="#cbd5e1" stroke="#334155" stroke-width="1">
    <rect x="230" y="380" width="60" height="40"/>
    <rect x="310" y="390" width="70" height="45"/>
    <rect x="400" y="375" width="80" height="50"/>
    <rect x="500" y="410" width="55" height="35"/>
    <rect x="250" y="450" width="90" height="55"/>
    <rect x="360" y="460" width="100" height="60"/>
  </g>

  <!-- Water River -->
  <path d="M 0 250 Q 400 200 800 280 L 800 330 Q 400 250 0 300 Z" fill="#1d4ed8"/>

  <!-- Metadata Stamp -->
  <rect x="15" y="15" width="220" height="42" fill="#0f172a" opacity="0.9" rx="4"/>
  <text x="25" y="32" fill="#f43f5e" font-family="monospace" font-size="11" font-weight="bold">OBSERVATION T2 (SEP 2026)</text>
  <text x="25" y="48" fill="#94a3b8" font-family="monospace" font-size="10">URBAN CONVERSION DETECTED</text>
</svg>
